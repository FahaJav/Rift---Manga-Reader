<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="riftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="riftCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="riftCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="riftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#riftBg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#riftCyan)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Dimensional Shards -->
  <g transform="translate(48, 48)">
    <!-- Left Wing Manga Frame -->
    <path d="M 60 290 C 130 260 170 280 190 300 L 190 100 C 170 80 130 60 60 85 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 85 115 L 165 102 M 85 145 L 165 132 M 85 175 L 145 165" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

    <!-- Right Wing Manga Frame -->
    <path d="M 356 290 C 286 260 246 280 226 300 L 226 100 C 246 80 286 60 356 85 Z" fill="#f8fafc" opacity="0.95" />
    <path d="M 330 115 L 250 102 M 330 145 L 250 132 M 330 175 L 270 165" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

    <!-- Central Glowing "Rift" Dimensional Tear (Stylized 'R' & Spatial Crack) -->
    <!-- Glow aura -->
    <path d="M 230 40 L 175 220 L 220 205 L 180 370 L 245 235 L 205 245 Z" fill="url(#riftCyan)" opacity="0.4" filter="url(#riftGlow)" />
    
    <!-- Sharp Rift Energy Lightning Strike -->
    <path d="M 226 40 L 178 220 L 222 205 L 182 370 L 242 235 L 204 245 Z" fill="url(#riftCyan)" filter="url(#riftGlow)" />
    
    <!-- Crimson Reverse Slash -->
    <path d="M 248 110 L 210 270 L 226 260 L 200 350" stroke="url(#riftCrimson)" stroke-width="6" stroke-linecap="round" filter="url(#riftGlow)" />

    <!-- Core Spatial Singularity Spark -->
    <circle cx="208" cy="225" r="16" fill="#ffffff" filter="url(#riftGlow)" />
    <circle cx="208" cy="225" r="9" fill="#06b6d4" />
  </g>
</svg>
